name: Publish JSON Schema

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

concurrency:
    group: publish-schema

jobs:
    publish-schema:
        name: Publish Schema to gh-pages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Check Tag Matches Package Version
              run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

            - name: Prepare gh-pages Worktree
              run: |
                  if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
                      git fetch origin gh-pages
                      git worktree add site gh-pages
                  else
                      git worktree add --orphan -b gh-pages site
                  fi

            - name: Generate Schema
              run: npm run generate:schema -- site/schema

            - name: Publish to gh-pages
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  cp -r public/schema site/
                  touch site/.nojekyll
                  cd site
                  git add -A
                  git commit -m "publish schema for $GITHUB_REF_NAME" || exit 0
                  git push origin gh-pages
