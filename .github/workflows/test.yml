name: Test

on:
    push:
        branches:
            - main
            - refactor
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: Lint, build and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Rojo
              uses: CompeyDev/setup-rokit@v0.2.1
              with:
                  cache: true

            - name: Install Dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Type-check End-to-End Tests
              run: npx tsc -p e2e

            - name: Test
              run: npm test
