name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    check-version:
        name: Check Tag Matches Package Version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Compare
              run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

    build:
        name: Build Binaries
        needs: check-version
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                      artifact_name: rogen
                      asset_name: rogen-${{ github.ref_name }}-linux-x86_64.tar.gz
                      compress_cmd: tar -czf
                    - os: windows-latest
                      target: win-x64
                      artifact_name: rogen.exe
                      asset_name: rogen-${{ github.ref_name }}-windows-x86_64.zip
                      compress_cmd: Compress-Archive -Path rogen.exe -DestinationPath
                    - os: macos-latest
                      target: macos-x64
                      artifact_name: rogen
                      asset_name: rogen-${{ github.ref_name }}-macos-x86_64.zip
                      compress_cmd: zip -r
                      node_platform: darwin-x64
                    - os: macos-latest
                      target: macos-arm64
                      artifact_name: rogen
                      asset_name: rogen-${{ github.ref_name }}-macos-arm64.zip
                      compress_cmd: zip -r

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Rojo
              if: matrix.target == 'linux-x64'
              uses: CompeyDev/setup-rokit@v0.2.1
              with:
                  cache: true

            - name: Install Dependencies
              run: npm ci

            - name: Bundle Code with esbuild
              run: npm run bundle

            # The macOS x64 binary is built on an arm64 runner, from an x64 Node.
            - name: Fetch Node for macOS x64
              if: matrix.node_platform == 'darwin-x64'
              run: |
                  NODE_VERSION=$(node -p process.version)
                  curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" | tar -xz
                  echo "TARGET_NODE=$PWD/node-${NODE_VERSION}-darwin-x64/bin/node" >> "$GITHUB_ENV"

            - name: Compile Script to Binary
              shell: bash
              run: |
                  if [ -n "$TARGET_NODE" ]; then
                      node scripts/make-binary.ts ${{ matrix.artifact_name }} --node "$TARGET_NODE" --platform darwin
                  else
                      node scripts/make-binary.ts ${{ matrix.artifact_name }}
                  fi

            - name: Test the Binary
              if: matrix.target == 'linux-x64'
              run: npm test -- e2e
              env:
                  ROGEN_E2E_BINARY: ${{ github.workspace }}/${{ matrix.artifact_name }}

            - name: Archive Binary (Windows)
              if: matrix.os == 'windows-latest'
              run: ${{ matrix.compress_cmd }} ${{ matrix.asset_name }}

            - name: Archive Binary (Unix)
              if: matrix.os != 'windows-latest'
              run: ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} ${{ matrix.artifact_name }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target }}-asset
                  path: ${{ matrix.asset_name }}
                  retention-days: 1

    publish:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download all compiled artifacts
              uses: actions/download-artifact@v4
              with:
                  path: final-assets
                  merge-multiple: true

            - name: Create Release and Upload Assets
              uses: softprops/action-gh-release@v2
              with:
                  files: final-assets/*
                  prerelease: ${{ contains(github.ref_name, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Last, since npm never accepts a version twice, while a failed GitHub release can be run again.
    npm:
        name: Publish to npm
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  registry-url: "https://registry.npmjs.org"

            # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
            - name: Update npm
              run: npm install -g npm@11

            - name: Install Dependencies
              run: npm ci

            # A pre-release goes to `next`, so `npm install` keeps giving the stable release.
            - name: Publish
              run: npm publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
